<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>P-ичный калькулятор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="tabs">
            <button class="tab-btn active" data-tab="calc">Калькулятор</button>
            <button class="tab-btn" data-tab="settings">Настройки</button>
        </div>

        <div class="tab-content active" id="calc">
            <div class="notation-display">
                <span id="current-notation">HEX</span>
            </div>
            <div class="display" id="display">0</div>
            
            <div class="memory-buttons">
                <button class="btn mem" id="mc" title="Очистить память">MC</button>
                <button class="btn mem" id="mr" title="Вставить из памяти">MR</button>
                <button class="btn mem" id="ms" title="Сохранить в память">MS</button>
                <button class="btn mem" id="m-plus" title="Добавить к памяти">M+</button>
                <span class="memory-indicator" id="memory-indicator">M</span>
            </div>

            <div class="buttons">
                <button class="btn func" id="ce">CE</button>
                <button class="btn func" id="backspace">⌫</button>
                <button class="btn func" id="sign">±</button>
                <button class="btn func" id="separator">.</button>

                <button class="btn num" id="d">D</button>
                <button class="btn num" id="e">E</button>
                <button class="btn num" id="f">F</button>
                <button class="btn num" id="sqr">x²</button>

                <button class="btn num" id="a">A</button>
                <button class="btn num" id="b">B</button>
                <button class="btn num" id="c">C</button>
                <button class="btn op" id="div">÷</button>

                <button class="btn num" id="7">7</button>
                <button class="btn num" id="8">8</button>
                <button class="btn num" id="9">9</button>
                <button class="btn op" id="mul">×</button>

                <button class="btn num" id="4">4</button>
                <button class="btn num" id="5">5</button>
                <button class="btn num" id="6">6</button>
                <button class="btn op" id="sub">−</button>

                <button class="btn num" id="1">1</button>
                <button class="btn num" id="2">2</button>
                <button class="btn num" id="3">3</button>
                <button class="btn op" id="add">+</button>

                <button class="btn num zero" id="0">0</button>
                <button class="btn op" id="equals">=</button>
            </div>
        </div>

        <div class="tab-content" id="settings">
            <div class="settings-group">
                <h3>Система счисления</h3>
                <select id="notation" class="select-css">
                    <option value="2">2 (BIN)</option>
                    <option value="8">8 (OCT)</option>
                    <option value="10">10 (DEC)</option>
                    <option value="16" selected>16 (HEX)</option>
                </select>
            </div>

            <div class="settings-group">
                <h3>Точность вычислений</h3>
                <div class="precision-control">
                    <input type="range" id="precision" min="0" max="5" value="2" class="slider">
                    <span id="precision-value">2</span>
                </div>
                <small>Количество знаков после запятой</small>
            </div>
        </div>
    </div>
    <script src="./renderer.js"></script>
</body>
</html>
